# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox
exec-once = ~/.config/hypr/scripts/sleep.sh # automatic screenlock
exec-once = hyprpaper
exec-once = bash ~/.config/hypr/scripts/wallpaper.sh # loading wallpaper
exec-once = dunst 
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar
exec-once = playerctld daemon   # better media keys
